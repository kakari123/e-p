        }

            to {

            }

    <script>
        // Enter button functionality
        document.getElementById('enterBtn').addEventListener('click', function() {
            document.getElementById('welcomePage').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            
            // Populate day dropdown
            const daySelect = document.getElementById('day');
            for (let i = 1; i <= 31; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                daySelect.appendChild(option);
            }

            // Populate month dropdown
            const monthSelect = document.getElementById('month');
            for (let i = 1; i <= 12; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                monthSelect.appendChild(option);
            }

            // Populate year dropdown
            const yearSelect = document.getElementById('year');
            const currentYear = new Date().getFullYear();
            for (let i = currentYear; i >= 1900; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                yearSelect.appendChild(option);
            }
        });

        // Function to format date
        function formatDate() {
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;
            
            if (day && month && year) {
                // Format with leading zeros
                const formattedDay = day.padStart(2, '0');
                const formattedMonth = month.padStart(2, '0');
                const formattedYear = year;
                
                // Create result in DDMMYYYY format
                const result = formattedDay + formattedMonth + formattedYear;
                
                // Show result
                document.getElementById('result').style.display = 'block';
                document.getElementById('resultValue').textContent = result;
                document.getElementById('result').classList.add('show');
            } else {
                document.getElementById('result').style.display = 'none';
                document.getElementById('result').classList.remove('show');
            }
        }

        // Add event listeners
        document.getElementById('day').addEventListener('change', formatDate);
        document.getElementById('month').addEventListener('change', formatDate);
        document.getElementById('year').addEventListener('change', formatDate);
    </script>
